<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prompt Optimizer</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
body { font-family: Arial; max-width: 900px; margin: auto; padding: 20px; }
textarea, input { width: 100%; margin-top:5px; margin-bottom:10px; padding:8px; }
button { padding:10px 20px; cursor:pointer; }
.result { margin-top:20px; border-top:1px solid #ccc; padding-top:10px; }
.candidate { margin-bottom:15px; }
.score { font-weight:bold; }
#plot { margin-top:30px; }
#progress { margin-top:15px; }
</style>
</head>
<body>
<h1>Prompt Optimizer</h1>

<label for="userPrompt">Enter your prompt:</label>
<textarea id="userPrompt" placeholder="Explain how inflation affects investment returns."></textarea>

<label for="numRounds">Number of optimization rounds:</label>
<input type="number" id="numRounds" placeholder="Default 3" min="1" max="10">

<button onclick="submitPrompt()">Optimize Prompt</button>

<div id="progress"></div>
<div id="results" class="result"></div>
<div id="plot"></div>

<script>
async function submitPrompt() {
    const prompt = document.getElementById("userPrompt").value;
    if (!prompt) return alert("Please enter a prompt.");
    const numRoundsInput = document.getElementById("numRounds").value;
    const numRounds = numRoundsInput ? parseInt(numRoundsInput) : 3;

    const progressDiv = document.getElementById("progress");
    progressDiv.innerHTML = "Running optimization...";

    const response = await fetch("http://127.0.0.1:8000/optimize", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({prompt: prompt, num_rounds:numRounds})
    });

    const data = await response.json();
    progressDiv.innerHTML = "Optimization complete.";

    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = `<h2>Best Prompt (Score: ${data.best_score})</h2><p>${data.best_prompt}</p><hr><h3>All Candidates:</h3>`;

    const rounds = {};
    data.all_candidates.forEach(c => {
        const div = document.createElement("div");
        div.className = "candidate";

        let penaltiesText = "";
        if(c.penalties){
            penaltiesText = `Drift: ${c.penalties.drift_penalty?.toFixed(2)}, 
                             Hallucination: ${c.penalties.hallucination_penalty?.toFixed(2)}, 
                             Repetition: ${c.penalties.repetition_penalty?.toFixed(2)}<br>`;
        }

        div.innerHTML = `<span class="score">Round ${c["Round"]} | Score: ${c["Final Score"]}</span><br>
                         ${penaltiesText}
                         <b>Prompt:</b> ${c["Prompt"]}<br>
                         <b>Output:</b> ${c["Output"]}`;
        resultsDiv.appendChild(div);

        if(!rounds[c["Round"]]) rounds[c["Round"]] = [];
        rounds[c["Round"]].push({x:c["Prompt No."], y:c["Final Score"]});
    });

    // Plot scores per round
    const traces = Object.keys(rounds).map(r => ({
        x: rounds[r].map(p=>p.x),
        y: rounds[r].map(p=>p.y),
        mode:'lines+markers',
        name:`Round ${r}`
    }));

    Plotly.newPlot('plot', traces, {
        title:'Score Variations Across Optimization Rounds',
        xaxis:{title:'Candidate Prompt Number'},
        yaxis:{title:'Score (0-1)', range:[0,1]}
    });
}
</script>
</body>
</html>
