<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCA Prompt Optimizer</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 950px; margin: auto; padding: 20px; background-color: #f0f2f5; color: #333; }
    
    .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { color: #2c3e50; margin-bottom: 5px; }
    p.subtitle { color: #7f8c8d; margin-top: 0; margin-bottom: 25px; }

    /* Inputs */
    label { font-weight: 600; margin-bottom: 8px; display: block; color: #34495e; }
    textarea { width: 100%; padding:15px; border:1px solid #ddd; border-radius:8px; font-family: inherit; font-size: 15px; resize: vertical; box-sizing: border-box; }
    
    button { background-color: #3498db; color: white; border: none; padding: 15px; cursor: pointer; border-radius: 8px; font-size: 16px; font-weight: 600; width: 100%; margin-top:15px; transition: background 0.2s; }
    button:hover { background-color: #2980b9; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }

    /* Log Box */
    #log-container { margin-top: 25px; background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; height: 160px; overflow-y: auto; font-size: 13px; display: none; border-left: 5px solid #e74c3c; }
    .log-line { margin: 4px 0; border-bottom: 1px solid #34495e; padding-bottom: 4px; }

    /* Results */
    #results-area { margin-top: 30px; }
    
    .best-box { background: #e8f5e9; border: 1px solid #c8e6c9; border-left: 5px solid #2ecc71; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    
    .round-card { background: #fff; border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
    .round-title { font-weight:bold; font-size:1.1em; margin-bottom:10px; color:#34495e; border-bottom:1px solid #eee; padding-bottom:5px; }
    
    .strategy-badge { background: #e3f2fd; color: #1565c0; padding: 3px 8px; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
    .score-badge { float:right; background: #95a5a6; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.9em; }
    .score-high { background: #27ae60; }
</style>
</head>
<body>

<div class="container">
    <h1>🩺 Automated RCA Optimizer</h1>
    <p class="subtitle">Diagnoses the root cause of prompt failure and prescribes a strategy.</p>

    <label for="initialPrompt">Enter your initial prompt:</label>
    <textarea id="initialPrompt" rows="3" placeholder="e.g., Explain gravity to a toddler."></textarea>
    
    <label for="numRounds">Optimization Rounds:</label>
    <input type="number" id="numRounds" value="3" min="1" max="5" style="padding:10px; border-radius:5px; border:1px solid #ddd;">

    <button id="btnStart" onclick="startOptimization()">Run Diagnostic Optimization</button>

    <div id="log-container"></div>
    <div id="results-area"></div>
    <div id="plot"></div>
</div>

<script>
    async function startOptimization() {
        const input = document.getElementById("initialPrompt");
        if (!input.value) return alert("Please enter a prompt.");
        
        // UI Reset
        const btn = document.getElementById("btnStart");
        const logDiv = document.getElementById("log-container");
        const resDiv = document.getElementById("results-area");
        const plotDiv = document.getElementById("plot");
        
        btn.disabled = true;
        btn.innerText = "Running Diagnostics...";
        logDiv.style.display = "block";
        logDiv.innerHTML = "";
        resDiv.innerHTML = "";
        plotDiv.innerHTML = "";

        try {
            const response = await fetch("/optimize", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    prompt: input.value, 
                    num_rounds: parseInt(document.getElementById("numRounds").value)
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = lines.pop(); 

                for (const line of lines) {
                    if (!line.trim()) continue;
                    try {
                        const data = JSON.parse(line);
                        
                        if (data.type === "progress") {
                            const p = document.createElement("div");
                            p.className = "log-line";
                            p.innerText = `> ${data.message}`;
                            logDiv.appendChild(p);
                            logDiv.scrollTop = logDiv.scrollHeight;
                        } 
                        else if (data.type === "result") {
                            renderFinalResults(data);
                        }
                    } catch (e) { console.error(e); }
                }
            }
        } catch (err) {
            logDiv.innerHTML += `<div style="color:red">Error: ${err.message}</div>`;
        } finally {
            btn.disabled = false;
            btn.innerText = "Run Diagnostic Optimization";
        }
    }

    function renderFinalResults(data) {
        const resDiv = document.getElementById("results-area");
        
        // Best Result
        let html = `
            <div class="best-box">
                <h3>🏆 Optimized Prompt (Score: ${data.best_score.toFixed(4)})</h3>
                <p style="white-space: pre-wrap;">${data.best_prompt}</p>
            </div>
            <h3>Detailed Diagnostic Logs</h3>
        `;

        // Group by Round
        const rounds = {};
        data.all_candidates.forEach(c => {
            if(!rounds[c["Round"]]) rounds[c["Round"]] = [];
            rounds[c["Round"]].push(c);
        });

        Object.keys(rounds).forEach(r => {
            const cands = rounds[r];
            const strategyUsed = cands[0].Strategy; // All cands in round use same strategy
            
            html += `
                <div class="round-card">
                    <div class="round-title">
                        Round ${r}: Prescribed <span class="strategy-badge">${strategyUsed}</span>
                    </div>
            `;
            
            cands.forEach(c => {
                 html += `
                    <div style="margin-top:10px; border-bottom:1px solid #eee; padding-bottom:10px;">
                        <div style="display:flex; justify-content:space-between">
                            <strong>Var ${c["Prompt No."]}</strong>
                            <span class="score-badge ${c["Final Score"]>0.8?'score-high':''}">Score: ${c["Final Score"].toFixed(4)}</span>
                        </div>
                        <div style="font-size:0.9em; margin-top:5px; color:#555">Output: ${c["Output"].substring(0, 100)}...</div>
                    </div>
                 `;
            });
            html += `</div>`;
        });

        resDiv.innerHTML = html;
        plotData(data.all_candidates);
    }

    function plotData(candidates) {
        const rounds = {};
        candidates.forEach(c => {
            if(!rounds[c["Round"]]) rounds[c["Round"]] = [];
            rounds[c["Round"]].push({x: c["Prompt No."], y: c["Final Score"]});
        });

        const traces = Object.keys(rounds).map(r => ({
            x: rounds[r].map(p=>p.x),
            y: rounds[r].map(p=>p.y),
            mode:'lines+markers',
            name:`Round ${r}`
        }));

        Plotly.newPlot('plot', traces, {
            title:'Diagnostic Performance (Zoomed)',
            xaxis:{title:'Variation #'},
            // CHANGED: Removed fixed range, added autorange
            yaxis:{
                title:'Score', 
                autorange: true, 
                tickformat: '.4f' // Show 4 decimal places
            },
            height: 400
        });
    }
</script>
</body>
</html>
